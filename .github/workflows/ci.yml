name: ci

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      dotnet: ${{ steps.detect.outputs.dotnet }}
      solution: ${{ steps.detect.outputs.solution }}
      node_dirs: ${{ steps.detect.outputs.node_dirs }}
      python: ${{ steps.detect.outputs.python }}
      docker: ${{ steps.detect.outputs.docker }}
      codeql_langs: ${{ steps.detect.outputs.codeql_langs }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: detect
        shell: bash
        run: |
          files=$(git ls-files)
          sln=$(echo "$files" | { grep -E '\.(sln|slnx)$' || true; } | awk -F/ '{print NF" "$0}' | sort -n | head -1 | cut -d' ' -f2-)
          csproj=$(echo "$files" | grep -E '\.csproj$' || true)
          node_dirs=$(echo "$files" | { grep -E '(^|/)package\.json$' || true; } | { grep -v node_modules || true; } | xargs -r -n1 dirname | jq -R . | jq -sc .)
          langs=()
          if [ -n "$csproj" ]; then echo "dotnet=true" >> "$GITHUB_OUTPUT"; langs+=("csharp"); else echo "dotnet=false" >> "$GITHUB_OUTPUT"; fi
          echo "solution=$sln" >> "$GITHUB_OUTPUT"
          echo "node_dirs=${node_dirs:-[]}" >> "$GITHUB_OUTPUT"
          if [ "${node_dirs:-[]}" != "[]" ]; then langs+=("javascript-typescript"); fi
          if echo "$files" | grep -qE '(^|/)(pyproject\.toml|requirements\.txt)$'; then echo "python=true" >> "$GITHUB_OUTPUT"; langs+=("python"); else echo "python=false" >> "$GITHUB_OUTPUT"; fi
          if echo "$files" | grep -qE '(^|/)(Dockerfile|docker-compose\.ya?ml|compose\.ya?ml)$'; then echo "docker=true" >> "$GITHUB_OUTPUT"; else echo "docker=false" >> "$GITHUB_OUTPUT"; fi
          echo "codeql_langs=$(printf '%s\n' "${langs[@]}" | { grep -v '^$' || true; } | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: lts/*
      - name: No comments
        run: node tools/check-comments.mjs
      - name: No secrets or PHI patterns
        run: node tools/check-secrets.mjs
      - name: Commit messages
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node tools/commit-policy.mjs range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dotnet:
    needs: detect
    if: needs.detect.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Start SQL Server
        run: |
          sa_password="Ci$(openssl rand -hex 16)!A"
          echo "::add-mask::$sa_password"
          docker run -d --name mssql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$sa_password" -p 1433:1433 mcr.microsoft.com/mssql/server:2025-latest
          echo "ConnectionStrings__Default=Server=localhost,1433;Database=PageTrail;User Id=sa;Password=$sa_password;TrustServerCertificate=True" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Solution present
        run: test -n "${{ needs.detect.outputs.solution }}" || (echo "::error::C# projects found but no .sln/.slnx at the root" && exit 1)
      - name: Restore
        run: dotnet restore "${{ needs.detect.outputs.solution }}"
      - name: Format
        run: dotnet format "${{ needs.detect.outputs.solution }}" --verify-no-changes --no-restore
      - name: Build
        run: dotnet build "${{ needs.detect.outputs.solution }}" --no-restore -c Release -warnaserror
      - name: Wait for SQL Server
        run: timeout 120 bash -c 'until docker logs mssql 2>&1 | grep -q "SQL Server is now ready for client connections"; do sleep 2; done'
      - name: Test
        run: dotnet test "${{ needs.detect.outputs.solution }}" --no-build -c Release --logger trx --results-directory TestResults --collect "XPlat Code Coverage"
      - name: Vulnerable packages
        run: |
          dotnet list "${{ needs.detect.outputs.solution }}" package --vulnerable --include-transitive | tee vuln.txt
          ! grep -q "has the following vulnerable packages" vuln.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dotnet-test-results
          path: TestResults
          if-no-files-found: ignore

  node:
    needs: detect
    if: needs.detect.outputs.node_dirs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.detect.outputs.node_dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: pnpm only
        run: |
          for f in package-lock.json yarn.lock bun.lockb bun.lock; do
            if [ -f "$f" ]; then echo "::error::$f found in ${{ matrix.dir }}; this repo uses pnpm"; exit 1; fi
          done
          node -e "const p=require('./package.json'); if(!String(p.packageManager||'').startsWith('pnpm@')){console.error('::error::package.json must declare packageManager pnpm@<version>');process.exit(1)}"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: ${{ matrix.dir }}/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: lts/*
      - name: Install
        run: if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install; fi
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run --if-present typecheck
      - name: Test
        run: pnpm run --if-present test
        env:
          CI: "true"
      - name: Build
        run: pnpm run --if-present build
      - name: Audit
        run: pnpm audit --prod --audit-level high

  python:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" || pip install -e .; fi
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  docker:
    needs: [detect, dotnet, node, python]
    if: always() && needs.detect.outputs.docker == 'true' && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Prepare env
        run: if [ -f .env.example ] && [ ! -f .env ]; then cp .env.example .env; fi
      - name: Build images
        run: |
          if [ -f docker-compose.yml ] || [ -f docker-compose.yaml ] || [ -f compose.yml ] || [ -f compose.yaml ]; then
            SA_PASSWORD="Ci$(openssl rand -hex 16)!A" RABBITMQ_USER=ci RABBITMQ_PASSWORD="$(openssl rand -hex 16)" docker compose build
          else docker build .; fi

  codeql:
    needs: detect
    if: github.event.repository.private == false && needs.detect.outputs.codeql_langs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(needs.detect.outputs.codeql_langs) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
